<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Horizon 2080 — Supervision</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<link rel="stylesheet" href="css/styles.css">
</head>

<body class="font-grotesk text-ink min-h-screen">

  <header class="bg-paper/90 backdrop-blur border-b border-border">
    <div class="max-w-[1600px] mx-auto px-6 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-xl bg-emerald-950 flex items-center justify-center text-neon font-mono font-bold text-sm">H2</div>
        <div>
          <p class="text-[10px] tracking-[0.25em] text-inkSoft font-semibold uppercase">Horizon 2080</p>
          <h1 class="text-base font-bold leading-tight">Supervision du vaisseau</h1>
        </div>
      </div>
      <div class="flex items-center gap-6">
        <div class="text-right">
          <p id="clock" class="font-mono text-xl font-semibold tabular-nums leading-none">00:00:00</p>
          <p id="dateLabel" class="text-[11px] text-inkSoft"></p>
        </div>
        <div class="flex items-center gap-2 pl-5 border-l border-border">
          <span id="statusDot" class="status-dot h-2 w-2 rounded-full bg-neon"></span>
          <span id="statusText" class="text-xs font-semibold text-emerald-700">Tous les systèmes en ligne</span>
        </div>
      </div>
    </div>
  </header>

  <div id="alertBar" class="border-b border-border bg-emerald-50">
    <div class="max-w-[1600px] mx-auto px-6 py-2 flex items-center gap-3">
      <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
      <p id="alertText" class="text-xs font-medium text-emerald-800">Chargement des données…</p>
    </div>
  </div>

  <main class="max-w-[1600px] w-full mx-auto px-6 py-4 grid grid-cols-1 md:grid-cols-3 gap-4">

    <section class="md:col-span-2 bg-white border border-border rounded-[18px] shadow-crisp p-5">
      <header class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-xl">🌍</span>
          <h2 class="font-bold text-sm">Module Environnement</h2>
        </div>
        <span class="text-[10px] font-mono text-inkSoft">ENV-01</span>
      </header>
      <div class="grid grid-cols-3 gap-4">
        <div>
          <p class="text-[10px] uppercase tracking-wide text-inkSoft font-semibold mb-0.5">Température</p>
          <p class="font-mono text-2xl font-semibold" id="valTemp">--<span class="text-sm text-inkSoft ml-1">°C</span></p>
        </div>
        <div>
          <p class="text-[10px] uppercase tracking-wide text-inkSoft font-semibold mb-0.5">Humidité air</p>
          <p class="font-mono text-2xl font-semibold" id="valHum">--<span class="text-sm text-inkSoft ml-1">%</span></p>
        </div>
        <div>
          <p class="text-[10px] uppercase tracking-wide text-inkSoft font-semibold mb-0.5">Luminosité</p>
          <p class="font-mono text-2xl font-semibold" id="valLux">--<span class="text-sm text-inkSoft ml-1">lux</span></p>
        </div>
      </div>
      <div class="flex items-center justify-between mt-3 pt-3 border-t border-border">
        <p class="text-[10px] uppercase tracking-wide text-inkSoft font-semibold">Historique</p>
        <div class="flex items-center gap-3 text-[10px] font-mono text-inkSoft">
          <span class="flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500 inline-block"></span>°C</span>
          <span class="flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-emerald-950 inline-block"></span>%</span>
        </div>
      </div>
      <div class="h-24 mt-1"><canvas id="envChart"></canvas></div>
    </section>

    <section class="md:col-span-1 bg-white border border-border rounded-[18px] shadow-crisp p-5">
      <header class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="text-xl">🛡️</span>
          <h2 class="font-bold text-sm">Sécurité</h2>
        </div>
        <span class="text-[10px] font-mono text-inkSoft">SEC-01</span>
      </header>
      <p class="text-[10px] uppercase tracking-wide text-inkSoft font-semibold text-center">CO₂</p>
      <div class="h-20"><canvas id="co2Gauge"></canvas></div>
      <div class="text-center -mt-1">
        <p class="text-[10px] uppercase tracking-wide text-inkSoft font-semibold mb-1">État de la porte</p>
        <p id="doorState" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-paperAlt text-inkSoft font-mono text-xs font-semibold">--</p>
      </div>
    </section>

  </main>

  <script type="module" src="js/main.js"></script>

</body>
</html>
